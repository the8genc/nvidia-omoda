skill: invoice-dispatch
agent: finance
description: Read, raise and void customer invoices
capabilities:
  - tool: quickbooks.invoice.read
    verb: read
    resource: quickbooks:invoice
    impact: []
    egress: { host: quickbooks.api.intuit.com, port: 443, path: "/v3/company/**" }
  - tool: quickbooks.invoice.create
    verb: create
    resource: quickbooks:invoice
    impact: [financial]
    egress: { host: quickbooks.api.intuit.com, port: 443, path: "/v3/company/**/invoice" }
  - tool: quickbooks.invoice.void
    verb: delete
    resource: quickbooks:invoice
    impact: [financial, legal]
    egress: { host: quickbooks.api.intuit.com, port: 443, path: "/v3/company/**/invoice/**" }
  - tool: fs.write
    verb: update
    impact: []
filesystem:
  read: [/workspace]
  write: [/workspace/out]
binaries: [/opt/hermes/.venv/bin/python, /usr/local/bin/node]
