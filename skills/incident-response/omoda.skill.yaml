# PROVISIONAL. The capability list is a placeholder until the See team supplies
# the manual runbook per event class (blocked: issue #13). The SHAPE is correct
# and the compiler treats it as real; only the specific tools will change.
#
# Every step a human performs today becomes one capability here. Steps that are
# reads run unattended. Steps that write and can reach a third party or a record
# of consequence require a recorded decision.
skill: incident-response
agent: responder
description: Respond to a detection from the See track
capabilities:
  # --- reads: run free, no human, no ceremony ---
  - tool: roads.segment.lookup
    verb: read
    resource: roads:segment
    impact: []
    egress: { host: roads.example.gov, port: 443, path: "/api/segments/**" }

  - tool: dispatch.status.read
    verb: read
    resource: dispatch:unit
    impact: []
    egress: { host: dispatch.example.gov, port: 443, path: "/api/units/**" }

  # --- contained write: reversible, ledgered, no consent ---
  - tool: fs.write
    verb: create
    resource: workspace:file
    impact: []

  # --- consequential: a third party sees this under our name ---
  - tool: incident.record.create
    verb: create
    resource: incident:record
    impact: [legal]
    egress: { host: dispatch.example.gov, port: 443, path: "/api/incidents" }

  - tool: supervisor.notify
    verb: create
    resource: comms:message
    impact: [reputational]
    egress: { host: dispatch.example.gov, port: 443, path: "/api/notify" }

  # --- destructive + consequential: two-person, inverse required ---
  - tool: incident.record.retract
    verb: delete
    resource: incident:record
    impact: [legal, reputational]
    egress: { host: dispatch.example.gov, port: 443, path: "/api/incidents/**" }
filesystem:
  read: [/workspace]
  write: [/workspace/out]
binaries: [/usr/local/bin/node]
